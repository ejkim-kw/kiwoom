<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>디지털폼 | 키움증권</title>
  <link rel="stylesheet" href="styles.css?v=20261124-account-badges">
  <link rel="stylesheet" href="presentation.css?v=20261124-account-badges">
  <link rel="stylesheet" href="digital-form.css?v=20261124-account-badges">
  <script defer src="digital-form-data.js?v=20261124-identity-change"></script>
  <script defer src="digital-form.js?v=20261124-identity-change"></script>
</head>
<body class="df-page">
  <a class="skip-link" href="#df-main">본문으로 이동</a>
  <div class="presentation-layout">
    <button type="button" class="mobile-console-trigger" popovertarget="df-tools">시연 도구</button>
    <div class="phone-preview">
      <div class="phone-device">
        <div class="device-display">
          <div class="device-status" aria-hidden="true">
            <span>9:41</span><span class="device-speaker"></span>
            <span class="device-indicators">
              <svg viewBox="0 0 20 16"><path d="M2 11h3v4H2zm4-3h3v7H6zm4-4h3v11h-3zm4-3h3v14h-3z" fill="currentColor"/></svg>
              <svg viewBox="0 0 20 16"><path d="M2 5a12 12 0 0 1 16 0M5 8a8 8 0 0 1 10 0M8 11a3 3 0 0 1 4 0" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/><circle cx="10" cy="14" r="1.3" fill="currentColor"/></svg>
              <svg class="device-battery" viewBox="0 0 26 14"><rect x="1" y="1" width="21" height="12" rx="3" fill="none" stroke="currentColor" stroke-width="1.2"/><rect x="3" y="3" width="17" height="8" rx="1.5" fill="currentColor"/><path d="M24 5v4" stroke="currentColor" stroke-width="2"/></svg>
            </span>
          </div>
          <div id="df-service"></div>
          <div class="device-home-indicator" aria-hidden="true"><span></span></div>
        </div>
        <dialog id="df-sheet" aria-labelledby="df-sheet-title"></dialog>
      </div>
    </div>
    <aside class="demo-console" id="df-tools" aria-labelledby="df-tools-title" popover>
      <p class="console-eyebrow">PROTOTYPE</p>
      <h2 id="df-tools-title">디지털폼 시연 도구</h2>
      <button type="button" class="mobile-console-close icon-button" popovertarget="df-tools" popovertargetaction="hide" aria-label="시연 도구 닫기">×</button>
      <p class="console-overview">준비된 예시 파일로 서류 등록과 접수 상태를 확인할 수 있습니다. 첨부 파일은 서버로 전송되지 않습니다.</p>
      <div class="console-actions">
        <button id="df-sample" class="console-button primary" type="button" data-do="sample">시연 서류 채우기</button>
        <button class="console-button" type="button" data-do="reset">시연 초기화하기</button>
        <details id="df-task-picker">
          <summary class="console-button">다른 업무 선택하기</summary>
          <div class="console-options" role="group" aria-label="서류 제출 업무"></div>
        </details>
        <a class="console-button" href="index.html#/home">디지털 ARS 열기</a>
      </div>
      <section class="console-notes" id="df-status-options" aria-labelledby="df-status-title" hidden>
        <h3 id="df-status-title">처리 상태</h3>
        <div class="console-options"></div>
      </section>
      <p class="console-feedback" id="df-feedback" role="status"></p>
    </aside>
  </div>
  <input type="file" hidden id="df-file">
  <noscript><p class="noscript">디지털폼을 이용하려면 JavaScript를 켜 주세요.</p></noscript>
</body>
</html>
